[workspace]
members = ["crates/minecraft-analysis", "crates/minecraft-analysis-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
cesu8 = "1.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
fastanvil = { version = "0.32", default-features = false }
fastnbt = "2.6"
flate2 = "1.1"
hex = "0.4"
indicatif = "0.17"
miette = { version = "7.6", features = ["fancy"] }
ratatui = "0.30"
proptest = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.20"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
